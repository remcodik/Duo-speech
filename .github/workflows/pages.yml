name: Publish to GitHub Pages

# Pages serves the gh-pages branch (auto-enabled when that branch was created).
# This workflow republishes the site there on every push to the dev branch.
on:
  push:
    branches: [claude/language-learning-app-ue3ww3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: |
          mkdir -p /tmp/site
          cp -r index.html css js icons manifest.webmanifest /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
